<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestor de vendas</title>
    <script>
        if (localStorage.getItem('gestor_tema') === 'dark') document.documentElement.classList.add('dark');
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* ==================== MODO ESCURO ==================== */
        html.dark body { background-color: #0f172a !important; color: #e2e8f0 !important; }
        html.dark .bg-white, html.dark .bg-slate-50 { background-color: #1e293b !important; }
        html.dark .bg-slate-100 { background-color: #0f172a !important; }
        html.dark .bg-slate-200 { background-color: #334155 !important; }
        html.dark .hover\:bg-slate-50:hover, html.dark .hover\:bg-slate-100:hover { background-color: #334155 !important; }
        html.dark .text-slate-900, html.dark .text-slate-800 { color: #f1f5f9 !important; }
        html.dark .text-slate-700 { color: #e2e8f0 !important; }
        html.dark .text-slate-600 { color: #cbd5e1 !important; }
        html.dark .text-slate-500, html.dark .text-slate-400 { color: #94a3b8 !important; }
        html.dark .text-emerald-700 { color: #6ee7b7 !important; }
        html.dark .border-slate-200, html.dark .border-slate-300, html.dark .border-slate-100 { border-color: #334155 !important; }
        html.dark .divide-slate-100 > * { border-color: #334155 !important; }
        html.dark thead.bg-slate-50 { background-color: #0f172a !important; }
        html.dark select, html.dark input {
            background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important;
        }
        html.dark .bg-amber-800 { background-color: #b45309 !important; }
        html.dark .bg-emerald-700 { background-color: #047857 !important; }
        html.dark .bg-slate-200:hover { background-color: #475569 !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <header class="bg-white border-b border-slate-200 px-5 py-4 flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-lg font-bold">Gestor de vendas</h1>
            <p id="header-loja" class="text-xs text-slate-500">Dashboard de vendas</p>
            <p id="periodo-label" class="text-xs text-slate-500">Carregando...</p>
        </div>
        <div class="flex flex-wrap gap-2">
            <a href="index.html" class="text-xs bg-white border border-slate-300 hover:bg-slate-100 px-3 py-2 rounded-lg"><i class="fa-solid fa-receipt mr-1"></i>Emissor</a>
            <button id="btn-tema" type="button" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg cursor-pointer" title="Alternar tema"><i class="fa-solid fa-moon"></i></button>
            <button id="btn-exportar" type="button" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg cursor-pointer"><i class="fa-solid fa-file-excel mr-1"></i>Exportar</button>
            <button id="btn-sair" type="button" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg cursor-pointer"><i class="fa-solid fa-right-from-bracket mr-1"></i>Sair</button>
        </div>
    </header>

    <main class="p-5 space-y-5 max-w-7xl mx-auto">

        <section class="bg-white p-4 rounded-xl border border-slate-200 flex flex-wrap items-end gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Período</label>
                <select id="filtro-periodo" class="px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none">
                    <option value="hoje">Hoje</option>
                    <option value="7d">Últimos 7 dias</option>
                    <option value="30d" selected>Últimos 30 dias</option>
                    <option value="mes">Mês atual</option>
                    <option value="ano">Ano atual</option>
                    <option value="tudo">Todo o período</option>
                    <option value="custom">Personalizado</option>
                </select>
            </div>
            <div id="campos-custom" class="hidden flex flex-wrap gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">De</label>
                    <input type="date" id="data-ini" class="px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Até</label>
                    <input type="date" id="data-fim" class="px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none">
                </div>
            </div>
        </section>

        <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">Faturamento</p>
                <p id="kpi-faturamento" class="text-xl font-bold text-emerald-700 mt-1">R$ 0,00</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">Pedidos</p>
                <p id="kpi-pedidos" class="text-xl font-bold mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">Ticket médio</p>
                <p id="kpi-ticket" class="text-xl font-bold mt-1">R$ 0,00</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">Itens vendidos</p>
                <p id="kpi-itens" class="text-xl font-bold mt-1">0</p>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 lg:col-span-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-3">Faturamento por dia</h2>
                <div class="h-64"><canvas id="graf-dia"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-3">Formas de pagamento</h2>
                <div class="h-64"><canvas id="graf-pagamento"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 lg:col-span-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-3">Top 10 produtos (faturamento)</h2>
                <div class="h-72"><canvas id="graf-produtos"></canvas></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-3">Vendas por hora</h2>
                <div class="h-72"><canvas id="graf-hora"></canvas></div>
            </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-600 p-4 border-b border-slate-200">Pedidos recentes</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-xs">
                    <thead class="bg-slate-50 text-slate-600">
                        <tr>
                            <th class="text-left px-4 py-2 font-semibold">Pedido</th>
                            <th class="text-left px-4 py-2 font-semibold">Data/Hora</th>
                            <th class="text-left px-4 py-2 font-semibold">Cliente</th>
                            <th class="text-left px-4 py-2 font-semibold">Pagamento</th>
                            <th class="text-right px-4 py-2 font-semibold">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pedidos" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <h3 id="modal-titulo" class="text-base font-bold text-slate-900">Aviso</h3>
            <p id="modal-texto" class="text-xs text-slate-600"></p>
            <div class="flex justify-end">
                <button type="button" id="modal-ok" class="px-4 py-2 text-xs font-semibold bg-amber-800 hover:bg-amber-900 text-white rounded-xl cursor-pointer">Entendi</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        // Use os mesmos valores do index.html
        const SUPABASE_URL = 'https://macnfahjnmbgqefncljs.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_tjr59YakGnKR8ha_gmzucw_zoEitFYf';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const $ = (id) => document.getElementById(id);
        const pad = (n) => String(n).padStart(2, '0');
        const pad6 = (n) => String(n).padStart(6, '0');
        const brl = (v) => `R$ ${(Number(v) || 0).toFixed(2).replace('.', ',')}`;
        const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const fmtData = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
        const fmtHora = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
        const endOfDay = (d) => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
        const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
        const esc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        function mostrarModal(titulo, texto) {
            $('modal-titulo').innerText = titulo;
            $('modal-texto').innerText = texto;
            $('modal').classList.remove('hidden');
            $('modal').classList.add('flex');
        }
        $('modal-ok').addEventListener('click', () => {
            $('modal').classList.add('hidden');
            $('modal').classList.remove('flex');
        });

        let lojaId = null;
        let pedidos = [];
        const charts = {};

        // ==================== TEMA ====================
        function aplicarTema(escuro) {
            document.documentElement.classList.toggle('dark', escuro);
            localStorage.setItem('gestor_tema', escuro ? 'dark' : 'light');
            $('btn-tema').querySelector('i').className = escuro ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            // Cores dos gráficos acompanham o tema
            Chart.defaults.color = escuro ? '#cbd5e1' : '#475569';
            Chart.defaults.borderColor = escuro ? '#334155' : '#e2e8f0';
            if (pedidos.length || lojaId) render();
        }

        function getRange() {
            const agora = new Date();
            const hoje = startOfDay(agora);
            switch ($('filtro-periodo').value) {
                case 'hoje': return [hoje, endOfDay(agora)];
                case '7d': return [addDays(hoje, -6), endOfDay(agora)];
                case '30d': return [addDays(hoje, -29), endOfDay(agora)];
                case 'mes': return [new Date(agora.getFullYear(), agora.getMonth(), 1), endOfDay(agora)];
                case 'ano': return [new Date(agora.getFullYear(), 0, 1), endOfDay(agora)];
                case 'custom': {
                    const a = $('data-ini').value;
                    const b = $('data-fim').value;
                    if (!a || !b) return null;
                    return [startOfDay(new Date(a + 'T00:00:00')), endOfDay(new Date(b + 'T00:00:00'))];
                }
                default: return [new Date(2000, 0, 1), endOfDay(agora)];
            }
        }

        async function carregar() {
            const range = getRange();
            if (!range) return;
            const [ini, fim] = range;
            $('periodo-label').innerText = `${fmtData(ini)} até ${fmtData(fim)}`;

            const { data, error } = await sb.from('pedidos')
                .select('*, pedido_itens(*)')
                .eq('loja_id', lojaId)
                .gte('data_hora', ini.toISOString())
                .lte('data_hora', fim.toISOString())
                .order('data_hora', { ascending: false })
                .limit(10000);

            if (error) return mostrarModal('Erro ao carregar vendas', error.message);
            pedidos = data || [];
            render();
        }

        function criarGrafico(id, config) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart($(id), config);
        }

        function render() {
            const faturamento = pedidos.reduce((s, p) => s + Number(p.total), 0);
            const qtdPedidos = pedidos.length;
            const itensVendidos = pedidos.reduce((s, p) =>
                s + (p.pedido_itens || []).reduce((a, i) => a + Number(i.quantidade), 0), 0);

            $('kpi-faturamento').innerText = brl(faturamento);
            $('kpi-pedidos').innerText = qtdPedidos;
            $('kpi-ticket').innerText = brl(qtdPedidos ? faturamento / qtdPedidos : 0);
            $('kpi-itens').innerText = itensVendidos;

            const porDia = new Map();
            pedidos.forEach(p => {
                const k = dayKey(new Date(p.data_hora));
                porDia.set(k, (porDia.get(k) || 0) + Number(p.total));
            });
            const dias = [...porDia.keys()].sort();
            criarGrafico('graf-dia', {
                type: 'bar',
                data: {
                    labels: dias.map(k => { const [, m, d] = k.split('-'); return `${d}/${m}`; }),
                    datasets: [{ label: 'Faturamento', data: dias.map(k => porDia.get(k)), backgroundColor: '#b45309', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { callback: v => brl(v) } } } }
            });

            const porPgto = new Map();
            pedidos.forEach(p => {
                const k = p.pagamento || 'Não informado';
                porPgto.set(k, (porPgto.get(k) || 0) + Number(p.total));
            });
            criarGrafico('graf-pagamento', {
                type: 'doughnut',
                data: {
                    labels: [...porPgto.keys()],
                    datasets: [{ data: [...porPgto.values()], backgroundColor: ['#b45309', '#059669', '#2563eb', '#d97706', '#7c3aed', '#64748b'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

            const porProduto = new Map();
            pedidos.forEach(p => (p.pedido_itens || []).forEach(i => {
                const atual = porProduto.get(i.nome) || { qtd: 0, valor: 0 };
                atual.qtd += Number(i.quantidade);
                atual.valor += Number(i.quantidade) * Number(i.valor_unitario);
                porProduto.set(i.nome, atual);
            }));
            const top = [...porProduto.entries()].sort((a, b) => b[1].valor - a[1].valor).slice(0, 10);
            criarGrafico('graf-produtos', {
                type: 'bar',
                data: {
                    labels: top.map(([nome]) => nome),
                    datasets: [{ label: 'Faturamento', data: top.map(([, v]) => v.valor), backgroundColor: '#059669', borderRadius: 4 }]
                },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { callback: v => brl(v) } } } }
            });

            const porHora = Array(24).fill(0);
            pedidos.forEach(p => { porHora[new Date(p.data_hora).getHours()] += Number(p.total); });
            criarGrafico('graf-hora', {
                type: 'bar',
                data: {
                    labels: porHora.map((_, h) => `${pad(h)}h`),
                    datasets: [{ label: 'Faturamento', data: porHora, backgroundColor: '#2563eb', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { callback: v => brl(v) } } } }
            });

            const linhas = pedidos.slice(0, 10).map(p => {
                const d = new Date(p.data_hora);
                return `<tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-mono">${pad6(p.numero)}</td>
                    <td class="px-4 py-2">${fmtData(d)} ${fmtHora(d)}</td>
                    <td class="px-4 py-2">${esc(p.cliente) || '—'}</td>
                    <td class="px-4 py-2">${esc(p.pagamento)}</td>
                    <td class="px-4 py-2 text-right font-bold">${brl(p.total)}</td>
                </tr>`;
            });
            $('tabela-pedidos').innerHTML = linhas.length
                ? linhas.join('')
                : `<tr><td colspan="5" class="px-4 py-6 text-center text-slate-400">Nenhuma venda no período.</td></tr>`;
        }

        function exportar() {
            if (!pedidos.length) return mostrarModal('Sem dados', 'Não há vendas no período selecionado.');

            const abaPedidos = pedidos.map(p => {
                const d = new Date(p.data_hora);
                return {
                    Pedido: pad6(p.numero), Data: fmtData(d), Hora: fmtHora(d), Cliente: p.cliente,
                    Contato: p.contato, Atendente: p.atendente, Pagamento: p.pagamento,
                    Subtotal: Number(p.subtotal), Entrega: Number(p.entrega), Desconto: Number(p.desconto),
                    Total: Number(p.total), Recebido: Number(p.recebido), Troco: Number(p.troco),
                    Observações: p.observacoes
                };
            });

            const abaItens = [];
            pedidos.forEach(p => (p.pedido_itens || []).forEach(i => abaItens.push({
                Pedido: pad6(p.numero), Produto: i.nome, Quantidade: Number(i.quantidade),
                'Valor Unitário': Number(i.valor_unitario),
                Total: Number(i.quantidade) * Number(i.valor_unitario)
            })));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(abaPedidos), 'Pedidos');
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(abaItens), 'Itens');
            XLSX.writeFile(wb, `vendas_${dayKey(new Date())}.xlsx`);
        }

        async function init() {
            aplicarTema(document.documentElement.classList.contains('dark'));

            const { data: { session } } = await sb.auth.getSession();
            if (!session) return location.href = 'index.html';

            const { data, error } = await sb.from('lojas').select('id, nome').eq('owner_id', session.user.id).maybeSingle();
            if (error || !data) return location.href = 'index.html';

            lojaId = data.id;
            if (data.nome) $('header-loja').innerText = data.nome;

            const hoje = dayKey(new Date());
            $('data-ini').value = hoje;
            $('data-fim').value = hoje;

            $('btn-tema').addEventListener('click', () => aplicarTema(!document.documentElement.classList.contains('dark')));
            $('filtro-periodo').addEventListener('change', () => {
                const custom = $('filtro-periodo').value === 'custom';
                $('campos-custom').classList.toggle('hidden', !custom);
                if (!custom) carregar();
            });
            ['data-ini', 'data-fim'].forEach(id => $(id).addEventListener('change', carregar));
            $('btn-exportar').addEventListener('click', exportar);
            $('btn-sair').addEventListener('click', async () => {
                await sb.auth.signOut();
                location.href = 'index.html';
            });

            await carregar();
        }

        init();
    })();
    </script>
</body>
</html>
